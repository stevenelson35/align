# Texas Hold'em: odds, outs, pot odds, positions and scenarios (33 cards).
# Import in Align: make a Flashcards list, then "Import a set of cards…" and choose this file.
- front: "2 outs after the flop (pocket pair to a set): chance to hit by the river?"
  back: "8.4% by the river; 4.3% with one card to come. (Rule of 2 and 4: about 8% / 4%.)"
- front: "4 outs after the flop (gutshot straight): chance to hit by the river?"
  back: "16.5% by the river; 8.7% with one card to come. (Rule of 2 and 4: about 16% / 8%.)"
- front: "6 outs after the flop (two overcards): chance to hit by the river?"
  back: "24.1% by the river; 13.0% with one card to come. (Rule of 2 and 4: about 24% / 12%.)"
- front: "8 outs after the flop (open-ended straight): chance to hit by the river?"
  back: "31.5% by the river; 17.4% with one card to come. (Rule of 2 and 4: about 32% / 16%.)"
- front: "9 outs after the flop (flush): chance to hit by the river?"
  back: "35.0% by the river; 19.6% with one card to come. (Rule of 2 and 4: about 36% / 18%.)"
- front: "12 outs after the flop (flush draw + gutshot): chance to hit by the river?"
  back: "45.0% by the river; 26.1% with one card to come. (Rule of 2 and 4: about 48% / 24%.)"
- front: "15 outs after the flop (flush draw + open-ended straight): chance to hit by the river?"
  back: "54.1% by the river; 32.6% with one card to come. (Rule of 2 and 4: about 60% / 30%.)"
- front: "Pot is $30, you must call $10. What equity do you need (pot odds)?"
  back: "25.0%: you risk $10 to win $40 in total (10 ÷ 40). Odds of 30:10 = 3.0 to 1."
- front: "Pot is $100, you must call $50. What equity do you need (pot odds)?"
  back: "33.3%: you risk $50 to win $150 in total (50 ÷ 150). Odds of 100:50 = 2.0 to 1."
- front: "Pot is $60, you must call $20. What equity do you need (pot odds)?"
  back: "25.0%: you risk $20 to win $80 in total (20 ÷ 80). Odds of 60:20 = 3.0 to 1."
- front: "Pot is $90, you must call $30. What equity do you need (pot odds)?"
  back: "25.0%: you risk $30 to win $120 in total (30 ÷ 120). Odds of 90:30 = 3.0 to 1."
- front: "Pot is $40, you must call $40. What equity do you need (pot odds)?"
  back: "50.0%: you risk $40 to win $80 in total (40 ÷ 80). Odds of 40:40 = 1.0 to 1."
- front: "Pot is $150, you must call $25. What equity do you need (pot odds)?"
  back: "14.3%: you risk $25 to win $175 in total (25 ÷ 175). Odds of 150:25 = 6.0 to 1."
- front: "Pocket aces: how often are they dealt?"
  back: "1 in 221 hands (0.45%)."
- front: "Any pocket pair: how often?"
  back: "About 1 in 17 hands (5.9%)."
- front: "Pocket pair: chance of flopping a set or better?"
  back: "About 11.8% (1 in 8.5)."
- front: "AA vs KK all in preflop: equity?"
  back: "AA about 82%, KK about 18%."
- front: "A pair vs two higher cards (QQ vs AK) preflop?"
  back: "Close to a coin flip; the pair is a small favorite (about 55–57%)."
- front: "AK vs AQ preflop?"
  back: "AK wins roughly 3 times in 4 (about 70–75%)."
- front: "Position: what is the button, and why is it good?"
  back: "The dealer seat. It acts last after the flop, so it sees everyone else’s actions first."
- front: "Under the gun (UTG)?"
  back: "The first player to act before the flop (left of the big blind). Play tighter there: everyone else acts after you."
- front: "Small blind and big blind?"
  back: "Forced bets posted by the two players left of the button before cards are dealt; the big blind is usually twice the small blind."
- front: "Implied odds?"
  back: "Extra money you expect to win on later streets if you hit. They can justify a call when pot odds alone are a little short."
- front: "Expected value (EV) of a call?"
  back: "Equity × (pot after your call) − the call. Positive means the call wins money in the long run."
- front: "Semi-bluff?"
  back: "Betting or raising with a draw: you can win now if they fold, or later if you hit."
- front: "Tight vs loose, passive vs aggressive?"
  back: "Tight/loose is how many hands you play; passive/aggressive is whether you mostly call or mostly bet and raise. Tight-aggressive is a solid default."
- front: "You hold J♥T♥; the flop is 9♥ 8♣ 2♥. How many outs, and your chance by the river?"
  back: "15 outs: 9 hearts for a flush plus 6 non-heart queens or sevens for a straight. About 54.1% by the river—you’re a favorite against one pair."
- front: "You hold 7♣7♦; the flop is K♠ 9♥ 4♦ and an opponent bets. What are you drawing to?"
  back: "Only 2 outs to a set (8.4% by the river, 4.3% next card). Without very good implied odds this is usually a fold."
- front: "You hold A♠K♦; the flop is Q♣ J♥ 3♠. Outs?"
  back: "4 tens for a straight (gutshot) plus 6 aces/kings for top pair: about 10 outs, roughly 38.4% by the river, though top pair may not be enough."
- front: "Flush draw, one card to come. Pot $100, opponent bets $50. Call on pot odds alone?"
  back: "No: you need 25% (50 ÷ 200) and have about 19.6% (9 ÷ 46). Calling needs implied odds—money you’ll win if you hit."
- front: "Open-ended straight draw after the flop. Pot $60, opponent bets $20. Call?"
  back: "Yes on pot odds: you need 20 ÷ 80 = 25% and have about 17.4% for the next card alone, 31.5% by the river if you’ll see both cards cheaply—close, and implied odds help."
- front: "How to assess a decision: what should you weigh?"
  back: "Your hand and outs (equity), the pot odds of the call, position (do you act last?), the number of players still in, stack sizes (implied odds), and what the opponent’s bets suggest they hold."
- front: "More players in the hand: how does it change things?"
  back: "More opponents means someone is more likely to have a strong hand, so medium hands (one pair) lose value and big draws gain value (bigger pots when you hit)."
